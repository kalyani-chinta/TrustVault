
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrustVault | My Documents</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background: #08111f;
            color: #f5f7ff;
        }

        .container { max-width: 800px; margin: auto; }
        h1, h2 { color: #65e6c3; }
        p { color: #aab7ca; line-height: 1.6; }
        a { color: #65e6c3; }

        .card {
            background: #111e30;
            border: 1px solid #26394d;
            border-radius: 12px;
            padding: 22px;
            margin: 20px 0;
        }

        input, textarea {
            display: block;
            width: 100%;
            margin: 12px 0;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #46546b;
            background: #08111f;
            color: white;
        }

        button {
            padding: 10px 16px;
            margin: 5px 5px 5px 0;
            border: 0;
            border-radius: 6px;
            background: #65e6c3;
            color: #08111f;
            font-weight: bold;
            cursor: pointer;
        }

        .secondary {
            background: #26394d;
            color: #f5f7ff;
        }

        .document {
            padding: 15px 0;
            border-bottom: 1px solid #26394d;
        }

        .document p {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .message { margin-top: 12px; }
    </style>
</head>
<body>
<div class="container">
    <a href="/">← Back to Home</a>
    <h1>My Documents</h1>
    <p>Create, manage and securely share your documents.</p>

    <div class="card">
        <h2>Create a Document</h2>
        <form id="documentForm">
            <input id="title" placeholder="Document title" required>
            <textarea id="content" placeholder="Document content"
                      rows="5" required></textarea>
            <button type="submit">Save Document</button>
        </form>
        <p id="message" class="message"></p>
    </div>

    <div class="card">
        <h2>My Saved Documents</h2>
        <button id="refreshButton" type="button">Refresh</button>
        <div id="documentsList"></div>
    </div>

    <div class="card">
        <h2>Shared With Me</h2>
        <button id="sharedRefreshButton" type="button" class="secondary">
            Refresh Shared Documents
        </button>
        <div id="sharedDocumentsList"></div>
    </div>
</div>

<script>
const message = document.getElementById("message");
const documentsList = document.getElementById("documentsList");
const sharedDocumentsList =
    document.getElementById("sharedDocumentsList");

async function readMessage(response) {
    return await response.json().catch(() => ({}));
}

async function loadDocuments() {
    documentsList.textContent = "Loading documents...";

    try {
        const response = await fetch("/api/documents");

        if (response.status === 401) {
            documentsList.textContent = "Please log in to view documents.";
            return;
        }

        if (!response.ok) {
            throw new Error("Could not load documents.");
        }

        const documents = await response.json();
        documentsList.replaceChildren();

        if (documents.length === 0) {
            documentsList.textContent = "No documents saved yet.";
            return;
        }

        documents.forEach(doc => {
            const item = document.createElement("div");
            item.className = "document";

            const heading = document.createElement("h3");
            heading.textContent = doc.title;

            const content = document.createElement("p");
            content.textContent = doc.content;

            const shareButton = document.createElement("button");
            shareButton.type = "button";
            shareButton.textContent = "Share";

            shareButton.addEventListener("click", async () => {
                const email = prompt(
                    "Enter the registered email of the user to share with:"
                );

                if (!email || !email.trim()) return;


                shareButton.disabled = true;

                try {
                    const shareResponse = await fetch(
                        `/api/documents/${doc.id}/share`,
                        {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify({
                                email: email.trim()
                            })
                        }
                    );

                    const result = await readMessage(shareResponse);

                    alert(
                        result.message ||
                        (shareResponse.ok
                            ? "Document shared successfully."
                            : "Could not share document.")
                    );
                } catch {
                    alert("Connection failed. Please try again.");
                } finally {
                    shareButton.disabled = false;
                }
            });
const revokeButton = document.createElement("button");
revokeButton.textContent = "Revoke Access";
revokeButton.type = "button";

revokeButton.addEventListener("click", async () => {
    const email = prompt("Enter the registered email to revoke access:");
    if (!email || !email.trim()) return;

    try {
        const response = await fetch(
            `/api/documents/${doc.id}/shares`
        );

        if (!response.ok) {
            alert("Could not find shared users.");
            return;
        }

        const shares = await response.json();
        console.log("SHARES FOUND:", shares);
        const share = shares.find(
            item => item.email.toLowerCase() === email.trim().toLowerCase()
        );

        if (!share) {
            alert("This user does not have access to this document.");
            return;
        }

        const revokeResponse = await fetch(
            `/api/documents/${doc.id}/share/${share.userId}`,
            { method: "DELETE" }
        );

        const result = await revokeResponse.json().catch(() => ({}));
        alert(result.message || (revokeResponse.ok
            ? "Access revoked successfully."
            : "Could not revoke access."));
} catch (error) {
    console.error("Revoke error:", error);
    alert("Revoke error: " + error.message);

    }
});
            item.append(heading, content, shareButton, revokeButton);
            documentsList.appendChild(item);
        });
    } catch {
        documentsList.textContent =
            "Could not load documents. Please refresh.";
    }
}

async function loadSharedDocuments() {
    sharedDocumentsList.textContent = "Loading shared documents...";

    try {
        const response = await fetch("/api/documents/shared-with-me");

        if (response.status === 401) {
            sharedDocumentsList.textContent =
                "Please log in to view shared documents.";
            return;
        }

        if (!response.ok) {
            throw new Error("Could not load shared documents.");
        }

        const documents = await response.json();
        sharedDocumentsList.replaceChildren();

        if (documents.length === 0) {
            sharedDocumentsList.textContent =
                "No documents have been shared with you yet.";
            return;
        }

        documents.forEach(doc => {
            const item = document.createElement("div");
            item.className = "document";

            const heading = document.createElement("h3");
            heading.textContent = doc.title;

            const content = document.createElement("p");
            content.textContent = doc.content;

            const openButton = document.createElement("button");
            openButton.type = "button";
            openButton.textContent = "Open Shared Document";

            openButton.addEventListener("click", async () => {
                try {
                    const openResponse =
                        await fetch(`/api/documents/${doc.id}`);

                    if (!openResponse.ok) {
                        alert("Unable to open document. Access may have been revoked.");
                        await loadSharedDocuments();
                        return;
                    }

                    const openedDoc = await openResponse.json();
                    alert(
                        "Document: " + openedDoc.title +
                        "\n\nContent:\n" + openedDoc.content
                    );
                } catch {
                    alert("Connection failed. Please try again.");
                }
            });

            item.append(heading, content, openButton);
            sharedDocumentsList.appendChild(item);
        });
    } catch {
        sharedDocumentsList.textContent =
            "Could not load shared documents. Please refresh.";
    }
}

document.getElementById("documentForm").addEventListener(
    "submit",
    async event => {
        event.preventDefault();
        message.textContent = "Saving document...";

        try {
            const response = await fetch("/api/documents", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    title: document.getElementById("title").value.trim(),
                    content: document.getElementById("content").value.trim()
                })
            });

            const result = await readMessage(response);

            if (response.status === 401) {
                message.textContent =
                    "Please log in before saving your document.";
                return;
            }

            if (!response.ok) {
                message.textContent =
                    result.message || "Could not save document.";
                return;
            }

            message.textContent = "Document saved successfully!";
            event.target.reset();
            await loadDocuments();
        } catch {
            message.textContent = "Connection failed. Please try again.";
        }
    }
);

document.getElementById("refreshButton")
    .addEventListener("click", loadDocuments);

document.getElementById("sharedRefreshButton")
    .addEventListener("click", loadSharedDocuments);

loadDocuments();
loadSharedDocuments();
</script>
</body>
</html>
