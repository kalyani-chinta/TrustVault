
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TrustVault | Login</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: grid;
            place-items: center; padding: 20px;
            font-family: Arial, sans-serif;
            background: #07111f; color: #eef5ff;
        }
        .card {
            width: 100%; max-width: 400px; padding: 32px;
            background: #101e30; border: 1px solid #263b52;
            border-radius: 16px;
        }
        h1 { margin-top: 0; color: #5eead4; }
        p { color: #a9bbcf; line-height: 1.5; }
        label { display: block; margin: 18px 0 8px; }
        input {
            width: 100%; padding: 12px; border-radius: 8px;
            border: 1px solid #40546c; background: #091525;
            color: white; font-size: 16px;
        }
        button {
            width: 100%; margin-top: 22px; padding: 13px;
            border: 0; border-radius: 8px; cursor: pointer;
            background: #5eead4; color: #07111f;
            font-size: 16px; font-weight: bold;
        }
        button:disabled { opacity: .6; cursor: wait; }
        a { color: #5eead4; }
        #message { overflow-wrap: anywhere; }
    </style>
</head>
<body>
    <main class="card">
        <h1>TrustVault</h1>
        <p>Sign in to access your secure document vault.</p>

        <form id="loginForm">
            <label for="email">Email address</label>
            <input id="email" type="email" required autocomplete="username">

            <label for="password">Password</label>
            <input id="password" type="password" required
                   autocomplete="current-password">

            <button id="loginButton" type="submit">Sign in</button>
        </form>

        <p id="message" role="status" aria-live="polite"></p>
        <p>New to TrustVault? <a href="/register.html">Create an account</a></p>
    </main>

    <script>
        const form = document.getElementById("loginForm");
        const button = document.getElementById("loginButton");
        const message = document.getElementById("message");

        form.addEventListener("submit", async function (event) {
            event.preventDefault();
            button.disabled = true;
            message.textContent = "Checking your credentials...";

            try {
                const response = await fetch("/api/login", {
                    method: "POST",
                    credentials: "same-origin",
                    headers: {
                        "Content-Type": "application/json",
                        "Accept": "application/json"
                    },
                    body: JSON.stringify({
                        email: document.getElementById("email").value.trim(),
                        password: document.getElementById("password").value
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    message.textContent = "Login successful. Opening your workspace...";
                    window.location.replace("/");
                } else {
                    message.textContent = data.message || "Login failed. Check your details.";
                    button.disabled = false;
                }
            } catch (error) {
                message.textContent = "Unable to connect. Check that the server is running.";
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
